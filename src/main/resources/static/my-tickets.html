<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Tickets</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="layout">
    <aside class="sidebar">
        <h2>HelpDesk Portal</h2>
        <a href="user-dashboard.html">Dashboard</a>
        <a href="create-ticket.html">Create Ticket</a>
        <a class="active" href="my-tickets.html">My Tickets / All Tickets</a>
        <a href="#" onclick="logout()">Logout</a>
    </aside>

    <main class="main-content">
        <header class="topbar">
            <h2>Ticket Management</h2>
        </header>

        <section class="panel">
            <h3>Ticket List</h3>

            <div class="table-wrap">
                <table>
                    <thead>
                    <tr>
                        <th>ID</th>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Priority</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                    </thead>
                    <tbody id="ticketList"></tbody>
                </table>
            </div>
        </section>
    </main>
</div>

<script src="js/auth.js"></script>
<script src="js/tickets.js"></script>
</body>
</html>
